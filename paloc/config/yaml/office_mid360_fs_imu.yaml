  showDegenercy: false

  useGlobalPrior: false
  useFixcov: false
  icpO3dType: 1
  degeneracy_thres: 20
  correspondence_dis: 1.0
  map_radius: 80
  map_filter_size: 0.1

  loopZOffset: 5.0
  historyKeyframeSearchRadius: 10.0
  historyKeyframeSearchTimeDiff: 30.0
  historyKeyframeSearchNum: 40
  loopFitnessScoreThreshold: 0.4
  loopClosureFrequency: 1

  filterDis: 0.2
  filterNodeNum: 5
