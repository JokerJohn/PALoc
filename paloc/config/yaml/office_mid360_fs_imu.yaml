common:
  imu_topic: "/imu_raw"

  acc_cov: 8.542347454980121e-03
  gyr_cov: 0.010145051118493028
  b_acc_cov: 5.681443420546884e-04
  b_gyr_cov: 1.147625523110903e-03

  # MID360 lidar in FS IMU/body frame, reused from FAST_LIO mid360_bag_fs_imu.yaml.
  extrinsic_T: [0.04837824, 0.08088706, 0.04309635]
  extrinsic_R: [0.96359699, 0.00546129, 0.26730324,
                -0.01278685, 0.99958863, 0.02567245,
                -0.26705307, -0.02815586, 0.96327042]

  odom_link: "camera_init"
  scan_filter_size: 0.1
